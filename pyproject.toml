[project]
name = "fusion-collection"
version = "0.3.2"
description = "Единое приложение сбора данных термического анализа (ВТА и ДТА) и управления нагревом"
authors = [{ name = "Ilya O. Yurev", email = "i.o.yurev@yandex.ru" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fusion-common",
    "loguru>=0.7.3",
    "numpy>=2.2.0",
    "pydantic>=2.11.0",
    "pyopengl>=3.1.9",
    "pyopengl-accelerate>=3.1.9",
    "pyqtgraph>=0.13.7",
    "pyserial>=3.5",
    "pyside6>=6.9.0",
]

[project.scripts]
fusion-collection = "fusion_collection.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pyinstaller>=6.13.0",
    "pytest>=9.0.0",
    "ruff>=0.11.0",
    "types-pyserial>=3.5.0",
    "vulture>=2.14",
]

[tool.uv.sources]
fusion-common = { git = "ssh://git@gitflic.ru/i-o-yurev/fusion-common.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusion_collection"]

[tool.vulture]
min_confidence = 60
paths = ["fusion_collection", "tests", "vulture_whitelist.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # any-type: разрешает typing.Any при работе с полиморфными обёртками Qt/PyQtGraph и метаданными
    "C901",    # complex-structure: диалоги, главный экран и обработчик опроса содержат последовательную логику UI/RS-485
    "COM812",  # missing-trailing-comma: конфликтует с правилами расстановки запятых форматтера ruff-format
    "CPY001",  # missing-copyright-notice: лицензия GPLv3 оформлена централизованно в LICENSE.md и LICENSE.ru.md
    "D100",    # undocumented-public-module: избыточный docstring на уровне очевидных модулей приложения и тестов
    "D101",    # undocumented-public-class: избыточный docstring для стандартных виджетов и диалогов Qt
    "D102",    # undocumented-public-method: избыточный docstring для стандартных слотов и методов Qt
    "D103",    # undocumented-public-function: избыточный docstring для очевидных вспомогательных и тестовых функций
    "D104",    # undocumented-public-package: __init__.py содержит только реэкспорт версии
    "D105",    # undocumented-magic-method: стандартные магические методы не требуют docstring
    "D107",    # undocumented-public-init: параметры конструкторов задокументированы строгими аннотациями типов
    "D203",    # incorrect-blank-line-before-class: взаимоисключающе конфликтует с правилом D211
    "D213",    # multi-line-summary-second-line: взаимоисключающе конфликтует с правилом D212
    "E501",    # line-too-long: длинные кириллические строки интерфейса и сообщений об ошибках не переносятся принудительно
    "EM101",   # raw-string-in-exception: кириллические сообщения об ошибках читаемее прямо в конструкторе raise
    "EM102",   # f-string-in-exception: f-строки с адресом модуля и сырым ответом удобнее формировать прямо в raise
    "FBT001",  # boolean-type-hint-positional-argument: слоты и методы Qt требуют позиционных bool-параметров
    "FBT002",  # boolean-default-value-positional-argument: совместимость с существующими флагами по умолчанию (notify_user=False и др.)
    "FBT003",  # boolean-positional-value-in-call: стандартные вызовы API Qt принимают позиционные bool (setEnabled, showGrid)
    "N802",    # invalid-function-name: переопределения виртуальных методов Qt используют camelCase (closeEvent и др.)
    "N803",    # invalid-argument-name: совместимость с унаследованными сигнатурами методов
    "N815",    # mixed-case-variable-in-class-scope: совместимость с историческими именами полей конфигурации и моделей
    "PLC0415", # import-outside-top-level: ленивые импорты после показа сплэш-экрана и системный импорт msvcrt под Windows
    "PLR0911", # too-many-return-statements: парсеры ответов RS-485 и валидаторы используют ранние возвраты
    "PLR0912", # too-many-branches: диспетчеризация режимов ВТА/ДТА и событий интерфейса
    "PLR0913", # too-many-arguments: конструктор сессии измерения и диалоги принимают полный набор полей паспорта
    "PLR0915", # too-many-statements: методы _build_ui и диалоги компонуют все элементы интерфейса в одном блоке
    "PLR0917", # too-many-positional-arguments: совместимость с унаследованными сигнатурами и вызовами Qt
    "PLR2004", # magic-value-comparison: аппаратные пороги, таймауты, адреса протокола ADAM и размеры UI естественны на месте
    "PLW0108", # unnecessary-lambda: в Qt-подключениях clicked.connect(lambda: ...) фиксируются аргументы и отложенный вызов
    "RUF001",  # ambiguous-unicode-character-string: ложное срабатывание на кириллицу в строках рядом с латиницей и единицами
    "RUF002",  # ambiguous-unicode-character-docstring: ложное срабатывание на русскоязычные docstrings
    "RUF003",  # ambiguous-unicode-character-comment: ложное срабатывание на русскоязычные комментарии
    "RUF102",  # invalid-noqa: ложно принимает директивы проектных AST-чекеров (# noqa: PU001, # noqa: MI001) за невалидные
    "S603",    # subprocess-without-shell-equals-true: единая политика для вызовов внешних CLI-утилит без shell=True
    "S607",    # start-process-with-partial-path: единая политика запуска внешних утилит через PATH
    "TRY003",  # raise-vanilla-args: подробные русскоязычные сообщения об ошибках передаются напрямую в стандартные исключения
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "INP001", # implicit-namespace-package: каталог тестов tests/ не является импортируемым пакетом и не требует __init__.py
    "S101",   # assert: штатный оператор утверждений в тестах pytest
    "SLF001", # private-member-access: тесты могут проверять внутреннее состояние и вспомогательные функции модулей
]
"vulture_whitelist.py" = [
    "INP001", # implicit-namespace-package: корневой файл белого списка vulture не является пакетом и не требует __init__.py
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
