[tool.poetry]
name = "fusion-collection"
version = "0.0.5"
description = ""
authors = ["Ilya Yurev <i.o.yurev@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pyside6 = "^6.6.0"
pyserial = "^3.5"
pglive = "^0.7.2"
pandas = "^2.1.3"
numpy = "^1.26.2,<2"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.6"
autoflake = "^2.2.1"
pyinstaller = "^6.2.0"
pre-commit = "^3.5.0"
commitizen = "^3.12.0"
mypy = "^1.7.1"
pillow = "^10.1.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version = "0.0.5"
version_files = [
    "fusion_collection/__version__.py",
    "pyproject.toml:version"
    ]
update_changelog_on_bump = true
major_version_zero = true

[tool.isort]
profile = "black"
